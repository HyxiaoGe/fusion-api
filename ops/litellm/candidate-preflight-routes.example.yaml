# 候选模型专用路由。部署时合并到 LiteLLM model_list，但不要写入 DB，
# 因而不会进入 Fusion 的持久模型选择器。
model_list:
  # 官方成本表尚未收录但已经过审计的精确候选路由。必须放在 wildcard
  # 之前，且价格只能绑定该模型，禁止把 K3 价格套到全部 Moonshot 候选。
  - model_name: candidate/moonshot/kimi-k3
    litellm_params:
      model: moonshot/kimi-k3
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      # LiteLLM 1.93 用 litellm_params 判定是否启用自定义定价；同时保留
      # model_info 副本，供模型信息接口、治理读回和后续版本兼容使用。
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
    model_info:
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      cache_read_input_token_cost: 0.0000003
      metadata:
        provider_key: moonshot
        purpose: candidate_pricing_override

  - model_name: candidate/moonshot/kimi-k2.7-code
    litellm_params:
      model: moonshot/kimi-k2.7-code
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000019
    model_info:
      input_cost_per_token: 0.00000095
      output_cost_per_token: 0.000004
      cache_read_input_token_cost: 0.00000019
      metadata:
        provider_key: moonshot
        purpose: candidate_pricing_override

  - model_name: candidate/moonshot/kimi-k2.7-code-highspeed
    litellm_params:
      model: moonshot/kimi-k2.7-code-highspeed
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
      input_cost_per_token: 0.0000019
      output_cost_per_token: 0.000008
      cache_read_input_token_cost: 0.00000038
    model_info:
      input_cost_per_token: 0.0000019
      output_cost_per_token: 0.000008
      cache_read_input_token_cost: 0.00000038
      metadata:
        provider_key: moonshot
        purpose: candidate_pricing_override

  - model_name: candidate/moonshot/*
    litellm_params:
      model: moonshot/*
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
    model_info:
      metadata:
        provider_key: moonshot
        purpose: candidate_preflight

  - model_name: candidate/deepseek/*
    litellm_params:
      model: deepseek/*
      api_base: https://api.deepseek.com/v1
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      metadata:
        provider_key: deepseek
        purpose: candidate_preflight

  - model_name: candidate/qwen/*
    litellm_params:
      model: openai/*
      api_base: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key: os.environ/QWEN_API_KEY
    model_info:
      metadata:
        provider_key: qwen
        purpose: candidate_preflight

  - model_name: candidate/xiaomi/*
    litellm_params:
      model: openai/*
      api_base: https://api.xiaomimimo.com/v1
      api_key: os.environ/XIAOMI_API_KEY
    model_info:
      metadata:
        provider_key: xiaomi
        purpose: candidate_preflight
