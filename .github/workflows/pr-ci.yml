name: Fusion API Pull Request CI

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: fusion-api-pr-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CI_IMAGE_NAME: fusion-api-ci
  CI_FLYAI_ADAPTER_IMAGE_NAME: fusion-flyai-adapter-ci

jobs:
  build:
    # 过渡检查名：branch protection 当前依赖此名称，实际执行器已隔离为临时 Linux runner。
    name: Build on Windows runner
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Verify Docker access
        run: |
          docker version
          docker ps

      - name: Test and build Docker image
        timeout-minutes: 15
        run: |
          bash .github/scripts/linux-build-and-test.sh \
            "${CI_IMAGE_NAME}" \
            "${CI_FLYAI_ADAPTER_IMAGE_NAME}" \
            "${GITHUB_SHA}"
