name: Fusion API Windows CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fusion-api-windows-ci-${{ github.ref }}
  cancel-in-progress: true

# 镜像源:阿里云 ACR 个人版(深圳,境内端点);改仓名只动 IMAGE_NAME 一行
env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/fusion-api
  FLYAI_ADAPTER_IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/fusion-flyai-adapter

jobs:
  build:
    name: Build on Windows runner
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%

      - name: Configure Docker credential directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Push CI/CD active metric
        if: github.ref == 'refs/heads/master'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try {
            # pushgateway 本体只绑 loopback,经 nginx 9094 鉴权反代推送(凭证在仓库 Secret PUSHGW_BASIC_AUTH)
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/fusion-api/branch_key/master/environment_key/dev" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5 | Out-Null
            Write-Host "CI/CD active metric pushed"
          } catch {
            Write-Host "CI/CD active metric push failed, ignored: $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify Docker access
        run: |
          docker version
          docker ps

      - name: Test and build Docker image
        timeout-minutes: 15
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = "Stop"
          $image = "${env:IMAGE_NAME}:${env:GITHUB_SHA}"
          $adapterImage = "${env:FLYAI_ADAPTER_IMAGE_NAME}:${env:GITHUB_SHA}"

          docker build --target production -t $image .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker run --rm $image sh -lc "timeout 300s python -m pip install --default-timeout=30 --no-cache-dir -r requirements-ci.txt && python scripts/check_architecture.py && ruff check . && timeout 270s python -u -m unittest discover -s test -t . -v"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker build --target test -t "${adapterImage}-test" ./flyai-adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker build --target production -t $adapterImage ./flyai-adapter
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push Docker image
        run: |
          docker push "%IMAGE_NAME%:%GITHUB_SHA%"
          docker push "%FLYAI_ADAPTER_IMAGE_NAME%:%GITHUB_SHA%"

      - name: Cleanup local Docker artifacts
        if: always()
        run: |
          docker image rm "%IMAGE_NAME%:%GITHUB_SHA%" 2>NUL
          docker image rm "%FLYAI_ADAPTER_IMAGE_NAME%:%GITHUB_SHA%" 2>NUL
          docker image rm "%FLYAI_ADAPTER_IMAGE_NAME%:%GITHUB_SHA%-test" 2>NUL
          docker builder prune --filter "until=72h" -f

  deploy-dev:
    name: Deploy master on dev server
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 10

    steps:
      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout smoke scripts
        uses: actions/checkout@v6

      - name: Login to ACR
        run: |
          # 登录失败时重试退避（境内 ACR 通常稳定，保留重试作防御）
          n=0
          until printf '%s' "${ACR_PASSWORD}" | docker login "${REGISTRY}" -u "${ACR_USERNAME}" --password-stdin; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker login 重试 $n 次仍失败"; exit 1; fi
            echo "docker login 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Pause model management worker before API deploy
        env:
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
        run: |
          set -euo pipefail
          management_enabled="$(printf '%s' "${DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          worker_enabled="$(printf '%s' "${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          case "${management_enabled}:${worker_enabled}" in
            true:true|true:false|false:false) ;;
            *) echo "模型管理开关必须为 true 或 false，且 Worker 不能单独启用"; exit 1 ;;
          esac
          systemctl --user stop fusion-litellm-model-management.timer >/dev/null 2>&1 || true
          if systemctl --user is-active --quiet fusion-litellm-model-management.service; then
            echo "模型准入 Worker 仍在执行，拒绝部署 API；定时器已安全暂停"
            exit 1
          fi

      - name: Apply alembic migrations
        run: |
          cd ~/project/fusion
          set -a
          source .env
          set +a
          n=0
          until docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker pull 重试 $n 次仍失败"; exit 1; fi
            echo "docker pull 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          docker run --rm \
            --network postgres_default \
            -e DATABASE_URL="${DATABASE_URL}" \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            alembic upgrade head

      - name: Pull and restart fusion-api
        env:
          DEPLOY_PROMPTHUB_API_KEY: ${{ secrets.PROMPTHUB_API_KEY }}
          DEPLOY_PROMPTHUB_SYNC_MODE: ${{ vars.PROMPTHUB_SYNC_MODE || 'disabled' }}
          DEPLOY_MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
          DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS: ${{ vars.MCP_ALLOWED_CREDENTIAL_REFS }}
          DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS: ${{ vars.MCP_CONNECT_TIMEOUT_SECONDS }}
          DEPLOY_MCP_CALL_TIMEOUT_SECONDS: ${{ vars.MCP_CALL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS: ${{ vars.MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS: ${{ vars.MCP_ADMIN_OPERATION_TIMEOUT_SECONDS }}
          DEPLOY_MCP_MAX_DISCOVERY_PAGES: ${{ vars.MCP_MAX_DISCOVERY_PAGES }}
          DEPLOY_MCP_MAX_DISCOVERED_TOOLS: ${{ vars.MCP_MAX_DISCOVERED_TOOLS }}
          DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS: ${{ vars.MCP_MAX_TOOL_DESCRIPTION_CHARS }}
          DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES: ${{ vars.MCP_MAX_TOOL_SCHEMA_BYTES }}
          DEPLOY_MCP_MAX_RESPONSE_BYTES: ${{ vars.MCP_MAX_RESPONSE_BYTES }}
          DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN: ${{ vars.MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN }}
          DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD }}
          DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS: ${{ vars.MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS }}
          DEPLOY_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEPLOY_AMAP_MCP_API_KEY: ${{ secrets.AMAP_MCP_API_KEY }}
          DEPLOY_CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          DEPLOY_FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
          DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS: ${{ vars.LITELLM_GOVERNANCE_MAX_AGE_SECONDS || '86400' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN: ${{ secrets.LITELLM_MODEL_ADMISSION_WORKER_TOKEN }}
        run: |
          cd ~/project/fusion
          set -o pipefail
          set -a
          source .env
          set +a
          export PROMPTHUB_API_KEY="${DEPLOY_PROMPTHUB_API_KEY:-}"
          export PROMPTHUB_SYNC_MODE="${DEPLOY_PROMPTHUB_SYNC_MODE:-disabled}"
          export MCP_ALLOWED_HOSTS="${DEPLOY_MCP_ALLOWED_HOSTS:-${MCP_ALLOWED_HOSTS:-learn.microsoft.com,dashscope.aliyuncs.com,mcp.amap.com,mcp.context7.com}}"
          export MCP_ALLOWED_CREDENTIAL_REFS="${DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS:-${MCP_ALLOWED_CREDENTIAL_REFS:-DASHSCOPE_API_KEY,AMAP_MCP_API_KEY,CONTEXT7_API_KEY}}"
          export MCP_CONNECT_TIMEOUT_SECONDS="${DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS:-${MCP_CONNECT_TIMEOUT_SECONDS:-5}}"
          export MCP_CALL_TIMEOUT_SECONDS="${DEPLOY_MCP_CALL_TIMEOUT_SECONDS:-${MCP_CALL_TIMEOUT_SECONDS:-15}}"
          export MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS="${DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-${MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-12}}"
          export MCP_ADMIN_OPERATION_TIMEOUT_SECONDS="${DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-${MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-35}}"
          export MCP_MAX_DISCOVERY_PAGES="${DEPLOY_MCP_MAX_DISCOVERY_PAGES:-${MCP_MAX_DISCOVERY_PAGES:-5}}"
          export MCP_MAX_DISCOVERED_TOOLS="${DEPLOY_MCP_MAX_DISCOVERED_TOOLS:-${MCP_MAX_DISCOVERED_TOOLS:-50}}"
          export MCP_MAX_TOOL_DESCRIPTION_CHARS="${DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS:-${MCP_MAX_TOOL_DESCRIPTION_CHARS:-2000}}"
          export MCP_MAX_TOOL_SCHEMA_BYTES="${DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES:-${MCP_MAX_TOOL_SCHEMA_BYTES:-32768}}"
          export MCP_MAX_RESPONSE_BYTES="${DEPLOY_MCP_MAX_RESPONSE_BYTES:-${MCP_MAX_RESPONSE_BYTES:-262144}}"
          export MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN="${DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-${MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-8}}"
          export MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD="${DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-${MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-3}}"
          export MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS="${DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-${MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-30}}"
          export DASHSCOPE_API_KEY="${DEPLOY_DASHSCOPE_API_KEY:-${DASHSCOPE_API_KEY:-}}"
          export AMAP_MCP_API_KEY="${DEPLOY_AMAP_MCP_API_KEY:-${AMAP_MCP_API_KEY:-}}"
          export CONTEXT7_API_KEY="${DEPLOY_CONTEXT7_API_KEY:-${CONTEXT7_API_KEY:-}}"
          export LITELLM_MODEL_MANAGEMENT_ENABLED="$(printf '%s' "${DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          export LITELLM_MODEL_ADMISSION_WORKER_ENABLED="$(printf '%s' "${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED:-false}" | tr '[:upper:]' '[:lower:]')"
          export LITELLM_GOVERNANCE_MAX_AGE_SECONDS="${DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS:-86400}"
          export LITELLM_MODEL_ADMISSION_WORKER_TOKEN="${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN:-}"
          case "${LITELLM_GOVERNANCE_MAX_AGE_SECONDS}" in
            ''|*[!0-9]*|0) echo "治理快照最大年龄必须是正整数"; exit 1 ;;
          esac
          case "${LITELLM_MODEL_MANAGEMENT_ENABLED}:${LITELLM_MODEL_ADMISSION_WORKER_ENABLED}" in
            true:true|true:false|false:false) ;;
            *) echo "模型管理开关必须为 true 或 false，且 Worker 不能单独启用"; exit 1 ;;
          esac
          if [ "${LITELLM_MODEL_ADMISSION_WORKER_ENABLED}" = "true" ] && [ -z "${LITELLM_MODEL_ADMISSION_WORKER_TOKEN}" ]; then
            echo "模型准入 Worker 已启用，但发布密钥未配置"
            exit 1
          fi
          append_csv_value() {
            current="$1"
            required="$2"
            if [ -z "${current}" ]; then
              printf '%s' "${required}"
              return
            fi
            case ",${current}," in
              *",${required},"*) printf '%s' "${current}" ;;
              *) printf '%s,%s' "${current}" "${required}" ;;
            esac
          }
          export MCP_ALLOWED_HOSTS="$(append_csv_value "${MCP_ALLOWED_HOSTS}" "mcp.context7.com")"
          export MCP_ALLOWED_CREDENTIAL_REFS="$(append_csv_value "${MCP_ALLOWED_CREDENTIAL_REFS}" "CONTEXT7_API_KEY")"
          export FLYAI_API_KEY="${DEPLOY_FLYAI_API_KEY:-}"
          if [ -z "${FLYAI_API_KEY}" ]; then
            echo "FlyAI 发布密钥未配置，拒绝以静默禁用方式部署"
            exit 1
          fi
          export FLYAI_ADAPTER_TOKEN="$(python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["FLYAI_API_KEY"].encode(), b"fusion-deploy-flyai-adapter-v1", hashlib.sha256).hexdigest(), end="")')"
          n=0
          until docker pull ${{ env.IMAGE_NAME }}:${{ github.sha }}; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker pull 重试 $n 次仍失败"; exit 1; fi
            echo "docker pull 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          n=0
          until docker pull ${{ env.FLYAI_ADAPTER_IMAGE_NAME }}:${{ github.sha }}; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "FlyAI adapter 镜像拉取重试 $n 次仍失败"; exit 1; fi
            echo "FlyAI adapter 镜像拉取失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          # dev 中 auth-service 只在 Docker 网络内暴露，未发布宿主机 8100。
          # 显式覆盖旧 .env 里的宿主机地址，避免 fusion-api JWKS/userinfo 校验连到不可达地址。
          export AUTH_SERVICE_INTERNAL_BASE_URL="http://auth-service:8100"
          test -d "${LITELLM_GOVERNANCE_ROOT_HOST:-/home/heyanxiao/backups/litellm-governance}"
          mkdir -p ./fusion-api/storage/files
          if docker container inspect fusion-api >/dev/null 2>&1; then
            if docker inspect fusion-api --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep -qx '/app/storage/files'; then
              echo "file storage already mounted; skip container file migration"
            elif docker exec fusion-api sh -lc 'test -d /app/storage/files'; then
              docker exec fusion-api sh -lc 'tar -C /app/storage/files -cf - .' | tar -C ./fusion-api/storage/files -xf -
            fi
          fi
          cat > docker-compose.fusion-api-ghcr.yml <<'EOF'
          services:
            flyai-adapter:
              image: ${{ env.FLYAI_ADAPTER_IMAGE_NAME }}:${{ github.sha }}
              container_name: fusion-flyai-adapter
              restart: always
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              pids_limit: 64
              mem_limit: 256m
              cpus: 0.5
              environment:
                - FLYAI_API_KEY=${FLYAI_API_KEY}
                - FLYAI_ADAPTER_TOKEN=${FLYAI_ADAPTER_TOKEN}
                - PORT=8080
              networks:
                - fusion-flyai

            fusion-api:
              image: ${{ env.IMAGE_NAME }}:${{ github.sha }}
              container_name: fusion-api
              command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
              restart: always
              ports:
                - "8002:8000"
              volumes:
                - ./fusion-api/logs:/app/logs
                - ./fusion-api/storage/files:/app/storage/files
                - ${LITELLM_GOVERNANCE_ROOT_HOST:-/home/heyanxiao/backups/litellm-governance}:/var/lib/fusion/litellm-governance:ro
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - SERVER_HOST=${SERVER_HOST}
                - FRONTEND_URL=${FRONTEND_URL}
                - CORS_ORIGINS=${CORS_ORIGINS}
                - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
                - FILE_STORAGE_PATH=/app/storage/files
                - FILE_UPLOAD_TIMEOUT_SECONDS=${FILE_UPLOAD_TIMEOUT_SECONDS:-60}
                - DIRECT_UPLOAD_STALE_SECONDS=${DIRECT_UPLOAD_STALE_SECONDS:-1800}
                - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
                - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
                - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
                - MINIO_BUCKET=${MINIO_BUCKET:-fusion-files}
                - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
                - MINIO_PRESIGN_EXPIRES=${MINIO_PRESIGN_EXPIRES:-3600}
                - OSS_ENDPOINT=${OSS_ENDPOINT:-}
                - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
                - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
                - OSS_BUCKET=${OSS_BUCKET:-}
                - OSS_USE_SSL=${OSS_USE_SSL:-true}
                - AUTH_SERVICE_BASE_URL=${AUTH_SERVICE_BASE_URL}
                - AUTH_SERVICE_JWKS_URL=${AUTH_SERVICE_JWKS_URL}
                - AUTH_SERVICE_CLIENT_ID=${AUTH_SERVICE_CLIENT_ID}
                - AUTH_SERVICE_JWT_LEEWAY_SECONDS=${AUTH_SERVICE_JWT_LEEWAY_SECONDS:-5}
                - AUTH_SERVICE_INTERNAL_BASE_URL=${AUTH_SERVICE_INTERNAL_BASE_URL:-http://auth-service:8100}
                - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
                - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
                - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
                - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                - REDIS_URL=${REDIS_URL:-redis://middleware-redis:6379/0}
                - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
                - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm-proxy:4000}
                - LITELLM_API_KEY=${LITELLM_API_KEY:-}
                - LITELLM_GOVERNANCE_ROOT=/var/lib/fusion/litellm-governance
                - LITELLM_GOVERNANCE_MAX_AGE_SECONDS=${LITELLM_GOVERNANCE_MAX_AGE_SECONDS:-86400}
                - LITELLM_MODEL_MANAGEMENT_ENABLED=${LITELLM_MODEL_MANAGEMENT_ENABLED:-false}
                - LITELLM_MODEL_ADMISSION_WORKER_ENABLED=${LITELLM_MODEL_ADMISSION_WORKER_ENABLED:-false}
                - LITELLM_MODEL_ADMISSION_WORKER_TOKEN=${LITELLM_MODEL_ADMISSION_WORKER_TOKEN:-}
                - LITELLM_MODEL_ADMISSION_LEASE_SECONDS=${LITELLM_MODEL_ADMISSION_LEASE_SECONDS:-600}
                - PROMPTHUB_SYNC_MODE=${PROMPTHUB_SYNC_MODE:-disabled}
                - PROMPTHUB_BASE_URL=${PROMPTHUB_BASE_URL:-http://prompthub-backend:8000}
                - PROMPTHUB_API_KEY=${PROMPTHUB_API_KEY:-}
                - PROMPTHUB_PROJECT_SLUG=${PROMPTHUB_PROJECT_SLUG:-fusion}
                - PROMPTHUB_REQUEST_TIMEOUT_SECONDS=${PROMPTHUB_REQUEST_TIMEOUT_SECONDS:-3}
                - PROMPTHUB_SYNC_INTERVAL_SECONDS=${PROMPTHUB_SYNC_INTERVAL_SECONDS:-300}
                - PROMPTHUB_SYNC_ON_STARTUP=${PROMPTHUB_SYNC_ON_STARTUP:-true}
                - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS}
                - MCP_ALLOWED_CREDENTIAL_REFS=${MCP_ALLOWED_CREDENTIAL_REFS}
                - MCP_CONNECT_TIMEOUT_SECONDS=${MCP_CONNECT_TIMEOUT_SECONDS}
                - MCP_CALL_TIMEOUT_SECONDS=${MCP_CALL_TIMEOUT_SECONDS}
                - MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS=${MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS}
                - MCP_ADMIN_OPERATION_TIMEOUT_SECONDS=${MCP_ADMIN_OPERATION_TIMEOUT_SECONDS}
                - MCP_MAX_DISCOVERY_PAGES=${MCP_MAX_DISCOVERY_PAGES}
                - MCP_MAX_DISCOVERED_TOOLS=${MCP_MAX_DISCOVERED_TOOLS}
                - MCP_MAX_TOOL_DESCRIPTION_CHARS=${MCP_MAX_TOOL_DESCRIPTION_CHARS}
                - MCP_MAX_TOOL_SCHEMA_BYTES=${MCP_MAX_TOOL_SCHEMA_BYTES}
                - MCP_MAX_RESPONSE_BYTES=${MCP_MAX_RESPONSE_BYTES}
                - MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN=${MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN}
                - MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD=${MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD}
                - MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS=${MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS}
                - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-}
                - AMAP_MCP_API_KEY=${AMAP_MCP_API_KEY:-}
                - CONTEXT7_API_KEY=${CONTEXT7_API_KEY:-}
                - ENABLE_FLYAI_TRAVEL_TOOLS=true
                - FLYAI_ADAPTER_BASE_URL=http://flyai-adapter:8080
                - FLYAI_ADAPTER_TOKEN=${FLYAI_ADAPTER_TOKEN}
                - FLYAI_TRAVEL_TOOL_TIMEOUT_SECONDS=20
                - FLYAI_TRAVEL_MAX_TOOL_CALLS_PER_RUN=4
                - ENABLE_DOCS=false
              deploy:
                resources:
                  limits:
                    cpus: "1"
                    memory: 1g
              networks:
                - postgres_default
                - middleware_default
                - fusion-prompthub
                - fusion-flyai

          networks:
            postgres_default:
              external: true
            middleware_default:
              external: true
            fusion-prompthub:
              external: true
            fusion-flyai:
              name: fusion-flyai
              driver: bridge
          EOF
          docker network inspect fusion-prompthub >/dev/null 2>&1 \
            || docker network create fusion-prompthub >/dev/null
          docker compose -f docker-compose.fusion-api-ghcr.yml up -d

      - name: Verify health
        run: |
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/health | grep -q '"status":"healthy"'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            docker logs --tail=120 fusion-api || true
            exit 1
          fi

          adapter_healthy=0
          for attempt in $(seq 1 30); do
            if docker exec fusion-flyai-adapter node -e \
              "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              adapter_healthy=1
              break
            fi
            sleep 2
          done
          if [ "$adapter_healthy" != "1" ]; then
            docker logs --tail=120 fusion-flyai-adapter || true
            exit 1
          fi

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings

          if not settings.ENABLE_FLYAI_TRAVEL_TOOLS:
              raise SystemExit("FlyAI travel tools are disabled")
          if settings.FLYAI_ADAPTER_BASE_URL != "http://flyai-adapter:8080":
              raise SystemExit("FlyAI adapter base URL mismatch")
          if not settings.FLYAI_ADAPTER_TOKEN:
              raise SystemExit("FlyAI adapter token is missing")
          print("FlyAI adapter configuration ok")
          PY

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings

          if "mcp.context7.com" not in settings.RESOLVED_MCP_ALLOWED_HOSTS:
              raise SystemExit("Context7 MCP host policy is missing")
          if "CONTEXT7_API_KEY" not in settings.RESOLVED_MCP_ALLOWED_CREDENTIAL_REFS:
              raise SystemExit("Context7 MCP credential policy is missing")
          print("Context7 MCP policy configuration ok")
          PY

          docker inspect fusion-api --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep -qx '/app/storage/files'
          docker inspect fusion-api --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep -qx '/var/lib/fusion/litellm-governance'
          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings

          if settings.LITELLM_GOVERNANCE_ROOT != "/var/lib/fusion/litellm-governance":
              raise SystemExit("LiteLLM governance mount path mismatch")
          if settings.LITELLM_GOVERNANCE_MAX_AGE_SECONDS <= 0:
              raise SystemExit("LiteLLM governance max age must be positive")
          if settings.LITELLM_MODEL_ADMISSION_WORKER_ENABLED and not settings.LITELLM_MODEL_MANAGEMENT_ENABLED:
              raise SystemExit("LiteLLM admission worker cannot be enabled while model management is disabled")
          if settings.LITELLM_MODEL_ADMISSION_WORKER_ENABLED and not settings.LITELLM_MODEL_ADMISSION_WORKER_TOKEN:
              raise SystemExit("LiteLLM admission worker token is missing")
          print("LiteLLM model management read-only boundary ok")
          PY
          docker exec -i fusion-api python - <<'PY'
          import asyncio
          import urllib.request

          from app.core.config import settings

          if settings.STORAGE_BACKEND == "local" and settings.FILE_STORAGE_PATH != "/app/storage/files":
              raise SystemExit(f"file storage path mismatch: {settings.FILE_STORAGE_PATH}")
          if settings.STORAGE_BACKEND == "oss":
              missing = [
                  name for name, value in {
                      "OSS_ENDPOINT": settings.OSS_ENDPOINT,
                      "OSS_ACCESS_KEY_ID": settings.OSS_ACCESS_KEY_ID,
                      "OSS_ACCESS_KEY_SECRET": settings.OSS_ACCESS_KEY_SECRET,
                      "OSS_BUCKET": settings.OSS_BUCKET,
                  }.items()
                  if not value
              ]
              if missing:
                  raise SystemExit(f"oss storage config missing: {', '.join(missing)}")
              from app.services.storage.oss_storage import OSSStorageBackend

              storage = OSSStorageBackend(
                  endpoint=settings.OSS_ENDPOINT,
                  access_key_id=settings.OSS_ACCESS_KEY_ID,
                  access_key_secret=settings.OSS_ACCESS_KEY_SECRET,
                  bucket=settings.OSS_BUCKET,
                  use_ssl=settings.OSS_USE_SSL,
              )
              upload = asyncio.run(
                  storage.get_upload_url(
                      "health/cors-preflight.txt",
                      content_type="text/plain",
                      expires=60,
                  )
              )
              origin = settings.FRONTEND_URL.rstrip("/")
              request = urllib.request.Request(
                  upload["url"],
                  method="OPTIONS",
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "PUT",
                      "Access-Control-Request-Headers": "content-type",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  headers = response.headers
              allow_origin = headers.get("Access-Control-Allow-Origin", "")
              allow_methods = headers.get("Access-Control-Allow-Methods", "")
              allow_headers = headers.get("Access-Control-Allow-Headers", "")
              if allow_origin not in {"*", origin}:
                  raise SystemExit("oss cors origin is not allowed")
              if "PUT" not in allow_methods.upper():
                  raise SystemExit("oss cors PUT method is not allowed")
              if "*" not in allow_headers and "CONTENT-TYPE" not in allow_headers.upper():
                  raise SystemExit("oss cors Content-Type header is not allowed")
          print(f"file storage backend ok: {settings.STORAGE_BACKEND}")
          PY

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings
          import urllib.request

          url = settings.RESOLVED_AUTH_SERVICE_JWKS_URL
          with urllib.request.urlopen(url, timeout=5) as response:
              if response.status != 200:
                  raise SystemExit(f"auth JWKS check failed: http={response.status} url={url}")
          print(f"auth JWKS ok: {url}")
          PY

          docker exec -i fusion-api python - <<'PY'
          import asyncio
          import json
          import re
          import urllib.error
          import urllib.request

          from app.core.config import settings

          raw_mode = settings.PROMPTHUB_SYNC_MODE
          mode = getattr(raw_mode, "value", raw_mode).strip().lower()
          if mode == "disabled":
              print("PromptHub bundle smoke skipped: sync mode is disabled")
              raise SystemExit(0)
          if mode not in {"shadow", "apply"}:
              raise SystemExit(f"unsupported PromptHub sync mode: {mode}")

          base_url = settings.PROMPTHUB_BASE_URL.rstrip("/")
          project_slug = settings.PROMPTHUB_PROJECT_SLUG
          api_key = settings.PROMPTHUB_API_KEY
          if not base_url or not project_slug or not api_key:
              raise SystemExit("PromptHub bundle smoke config is incomplete")

          url = f"{base_url}/api/v1/projects/by-slug/{project_slug}/prompts/published"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {api_key}"},
          )
          try:
              with urllib.request.urlopen(
                  request,
                  timeout=settings.PROMPTHUB_REQUEST_TIMEOUT_SECONDS,
              ) as response:
                  status = response.status
                  body = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"PromptHub bundle smoke failed: HTTP {exc.code}") from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"PromptHub bundle smoke failed: {exc.reason}") from None

          if status != 200 or body.get("code") != 0:
              raise SystemExit("PromptHub bundle smoke returned an invalid response")
          data = body.get("data")
          if not isinstance(data, dict):
              raise SystemExit("PromptHub bundle smoke data is missing")
          prompts = data.get("prompts")
          revision = data.get("revision")
          if not isinstance(prompts, list) or len(prompts) != 11:
              count = len(prompts) if isinstance(prompts, list) else "invalid"
              raise SystemExit(f"PromptHub bundle smoke prompt count mismatch: {count}")
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{64}", revision) is None:
              raise SystemExit("PromptHub bundle smoke revision is invalid")

          from app.db.database import SessionLocal
          from app.db.models import RuntimeConfigEntry
          from app.services.prompthub_sync_service import sync_prompthub_bundle

          sync_result = asyncio.run(sync_prompthub_bundle())
          if sync_result.get("status") != "success" or sync_result.get("revision") != revision:
              raise SystemExit("PromptHub sync did not persist the fetched revision")

          session = SessionLocal()
          try:
              rows = (
                  session.query(RuntimeConfigEntry)
                  .filter(
                      RuntimeConfigEntry.namespace == "prompt_bundle",
                      RuntimeConfigEntry.key == "fusion",
                  )
                  .all()
              )
          finally:
              session.close()
          matching = [row for row in rows if row.version == revision]
          active = [row for row in rows if row.is_active]
          if len(matching) != 1:
              raise SystemExit("PromptHub synced revision is missing or duplicated")
          if mode == "shadow" and matching[0].is_active:
              raise SystemExit("PromptHub shadow revision must remain inactive")
          if mode == "apply" and (not matching[0].is_active or len(active) != 1):
              raise SystemExit("PromptHub apply revision was not atomically activated")
          print(
              "PromptHub bundle smoke passed: "
              f"mode={mode} prompts={len(prompts)} revision={revision[:12]}... persisted=true"
          )
          PY

      - name: Install LiteLLM governance discovery
        run: |
          set -euo pipefail
          release_dir="${HOME}/.local/share/fusion/litellm-governance-src-${GITHUB_SHA}"
          current_link="${HOME}/.local/share/fusion/litellm-governance-current"
          config_dir="${HOME}/.config/fusion"
          registry_target="${config_dir}/litellm-provider-registry.json"
          unit_dir="${HOME}/.config/systemd/user"
          install -d -m 0755 "${release_dir}/scripts" "${release_dir}/ops/litellm" "${unit_dir}"
          install -d -m 0700 "${config_dir}"
          systemctl --user stop fusion-litellm-governance.timer >/dev/null 2>&1 || true
          if systemctl --user is-active --quiet fusion-litellm-governance.service; then
            echo "LiteLLM 治理周期仍在执行，拒绝切换发现版本；定时器已安全暂停"
            exit 1
          fi
          for script in \
            check_litellm_candidate_preflight.py \
            check_litellm_governance_runtime.py \
            discover_litellm_model_candidates.py \
            enrich_litellm_model_candidates.py \
            fetch_litellm_cost_map.py \
            orchestrate_litellm_model_candidates.py \
            plan_litellm_candidate_admission.py \
            run_litellm_governance_cycle.py \
            run_litellm_governance_unit.py; do
            install -m 0644 "${GITHUB_WORKSPACE}/scripts/${script}" "${release_dir}/scripts/${script}"
          done
          install -m 0644 \
            "${GITHUB_WORKSPACE}/ops/litellm/candidate-overrides.json" \
            "${release_dir}/ops/litellm/candidate-overrides.json"
          if [ -e "${current_link}" ] && [ ! -L "${current_link}" ]; then
            echo "LiteLLM 治理当前版本路径不是符号链接，拒绝覆盖"
            exit 1
          fi
          if [ -e "${registry_target}" ] && [ -L "${registry_target}" ]; then
            echo "LiteLLM provider registry 不能是符号链接"
            exit 1
          fi
          registry_temp="$(mktemp "${config_dir}/.litellm-provider-registry.XXXXXX")"
          trap 'rm -f "${registry_temp}"' EXIT
          install -m 0600 \
            "${GITHUB_WORKSPACE}/ops/litellm/provider-registry.example.json" \
            "${registry_temp}"
          python3 - "${registry_temp}" <<'PY'
          import json
          import pathlib
          import sys

          payload = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          if not isinstance(payload, dict) or not isinstance(payload.get("providers"), list):
              raise SystemExit("LiteLLM provider registry 结构无效")
          PY
          mv -f "${registry_temp}" "${registry_target}"
          trap - EXIT
          install -m 0644 \
            "${GITHUB_WORKSPACE}/ops/litellm/fusion-litellm-governance.service" \
            "${GITHUB_WORKSPACE}/ops/litellm/fusion-litellm-governance.timer" \
            "${unit_dir}/"
          ln -sfn "${release_dir}" "${current_link}"
          systemctl --user daemon-reload
          systemd-analyze --user verify \
            "${unit_dir}/fusion-litellm-governance.service" \
            "${unit_dir}/fusion-litellm-governance.timer"
          systemctl --user enable --now fusion-litellm-governance.timer
          systemctl --user is-active --quiet fusion-litellm-governance.timer

      - name: Install model management worker
        env:
          DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED: ${{ vars.LITELLM_MODEL_MANAGEMENT_ENABLED || 'false' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED: ${{ vars.LITELLM_MODEL_ADMISSION_WORKER_ENABLED || 'false' }}
          DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS: ${{ vars.LITELLM_GOVERNANCE_MAX_AGE_SECONDS || '86400' }}
          DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN: ${{ secrets.LITELLM_MODEL_ADMISSION_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          management_enabled="$(printf '%s' "${DEPLOY_LITELLM_MODEL_MANAGEMENT_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          worker_enabled="$(printf '%s' "${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_ENABLED}" | tr '[:upper:]' '[:lower:]')"
          release_dir="${HOME}/.local/share/fusion/litellm-model-management-src-${GITHUB_SHA}"
          current_link="${HOME}/.local/share/fusion/litellm-model-management-current"
          state_dir="${HOME}/.local/state/fusion/litellm-model-management"
          acceptance_dir="${HOME}/.local/share/fusion/litellm-acceptance"
          unit_dir="${HOME}/.config/systemd/user"
          install -d -m 0755 "${release_dir}/scripts" "${unit_dir}"
          install -d -m 0700 "${state_dir}" "${acceptance_dir}"
          systemctl --user stop fusion-litellm-model-management.timer >/dev/null 2>&1 || true
          if systemctl --user is-active --quiet fusion-litellm-model-management.service; then
            echo "模型准入 Worker 仍在执行，拒绝切换运行版本；定时器已安全暂停"
            exit 1
          fi
          for script in \
            audit_litellm_model_catalog.py \
            check_litellm_candidate_preflight.py \
            check_litellm_governance_runtime.py \
            check_litellm_model_management_worker_env.py \
            configure_litellm_model_management_worker_env.py \
            execute_litellm_candidate_admission.py \
            plan_litellm_candidate_admission.py \
            run_litellm_governance_unit.py \
            run_litellm_model_management_worker.py \
            verify_litellm_governance_snapshot.py; do
            install -m 0644 "${GITHUB_WORKSPACE}/scripts/${script}" "${release_dir}/scripts/${script}"
          done
          install -m 0644 \
            "${GITHUB_WORKSPACE}/ops/litellm/fusion-litellm-model-management.service" \
            "${GITHUB_WORKSPACE}/ops/litellm/fusion-litellm-model-management.timer" \
            "${unit_dir}/"
          if [ -e "${current_link}" ] && [ ! -L "${current_link}" ]; then
            echo "模型准入 Worker 当前版本路径不是符号链接，拒绝覆盖"
            exit 1
          fi
          ln -sfn "${release_dir}" "${current_link}"
          systemctl --user daemon-reload
          systemd-analyze --user verify \
            "${unit_dir}/fusion-litellm-model-management.service" \
            "${unit_dir}/fusion-litellm-model-management.timer"

          if [ "${management_enabled}" != "true" ] || [ "${worker_enabled}" != "true" ]; then
            systemctl --user disable --now fusion-litellm-model-management.timer >/dev/null 2>&1 || true
            echo "模型准入 Worker 未启用；已安装版本化运行文件并保持定时器关闭"
            exit 0
          fi
          if [ -z "${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN}" ]; then
            echo "模型准入 Worker 已启用，但发布密钥未配置"
            exit 1
          fi

          proxy_env="${HOME}/project/litellm-proxy/.env"
          governance_env="${HOME}/.config/fusion/litellm-governance.env"
          python3 - "${proxy_env}" "${governance_env}" <<'PY'
          import os
          import pathlib
          import stat
          import sys

          for raw_path in sys.argv[1:]:
              path = pathlib.Path(raw_path)
              file_stat = path.lstat()
              if path.is_symlink() or not stat.S_ISREG(file_stat.st_mode):
                  raise SystemExit(f"治理密钥文件不是普通文件: {path}")
              if file_stat.st_uid != os.getuid():
                  raise SystemExit(f"治理密钥文件 owner 不匹配: {path}")
              os.chmod(path, 0o600, follow_symlinks=False)
          PY

          set +u
          set -a
          source "${HOME}/project/fusion/.env"
          set +a
          set -u
          export LITELLM_VIRTUAL_KEY="${LITELLM_API_KEY:-}"
          export LITELLM_MODEL_ADMISSION_WORKER_TOKEN="${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN}"
          export FUSION_MODEL_MANAGEMENT_BASE_URL="http://127.0.0.1:8002"
          export LITELLM_GOVERNANCE_MAX_AGE_SECONDS="${DEPLOY_LITELLM_GOVERNANCE_MAX_AGE_SECONDS}"
          expected_token_sha256="$(printf '%s' "${DEPLOY_LITELLM_MODEL_ADMISSION_WORKER_TOKEN}" | sha256sum | awk '{print $1}')"
          cd "${current_link}"
          "${HOME}/.local/share/fusion/litellm-governance-venv/bin/python" \
            -m scripts.configure_litellm_model_management_worker_env \
            --env-file "${governance_env}"
          "${HOME}/.local/share/fusion/litellm-governance-venv/bin/python" \
            -m scripts.run_litellm_governance_unit \
            --proxy-env "${proxy_env}" \
            --governance-env "${governance_env}" \
            --registry "${HOME}/.config/fusion/litellm-provider-registry.json" \
            --require-env LITELLM_MASTER_KEY \
            --require-env LITELLM_VIRTUAL_KEY \
            --require-env LITELLM_MODEL_ADMISSION_WORKER_TOKEN \
            --require-env LITELLM_GOVERNANCE_MAX_AGE_SECONDS \
            --require-env LITELLM_CANDIDATE_KEY \
            -- \
            "${HOME}/.local/share/fusion/litellm-governance-venv/bin/python" \
              -m scripts.check_litellm_model_management_worker_env \
              --expected-token-sha256 "${expected_token_sha256}" \
              --expected-base-url http://127.0.0.1:8002 \
              --expected-governance-max-age-seconds "${LITELLM_GOVERNANCE_MAX_AGE_SECONDS}"
          systemctl --user enable --now fusion-litellm-model-management.timer
          systemctl --user is-active --quiet fusion-litellm-model-management.timer

      - name: Run deployment smoke
        run: |
          # scripts/deployment_smoke.py checks /health and /api/models/.
          if ! python3 scripts/deployment_smoke.py --base-url http://127.0.0.1:8002; then
            echo "fusion-api deployment smoke failed"
