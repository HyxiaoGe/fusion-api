          networks:
            postgres_default:
              external: true
            middleware_default:
              external: true
            fusion-prompthub:
              external: true
            fusion-flyai:
              name: fusion-flyai
              driver: bridge
          EOF
          docker network inspect fusion-prompthub >/dev/null 2>&1 \
            || docker network create fusion-prompthub >/dev/null
          docker compose -f docker-compose.fusion-api-ghcr.yml up -d

      - name: Verify deployed image identity
        id: verify_image_identity
        run: |
          expected_api_image="${IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          actual_api_image="$(docker inspect fusion-api --format '{{.Config.Image}}')"
          if [ "${actual_api_image}" != "${expected_api_image}" ]; then
            echo "fusion-api 镜像不匹配: expected=${expected_api_image} actual=${actual_api_image}"
            exit 1
          fi
          expected_api_id="$(docker image inspect "${expected_api_image}" --format '{{.Id}}')"
          actual_api_id="$(docker inspect fusion-api --format '{{.Image}}')"
          if [ "${actual_api_id}" != "${expected_api_id}" ]; then
            echo "fusion-api 内容 ID 不匹配: expected=${expected_api_id} actual=${actual_api_id}"
            exit 1
          fi

          expected_adapter_image="${FLYAI_ADAPTER_IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          actual_adapter_image="$(docker inspect fusion-flyai-adapter --format '{{.Config.Image}}')"
          if [ "${actual_adapter_image}" != "${expected_adapter_image}" ]; then
            echo "fusion-flyai-adapter 镜像不匹配: expected=${expected_adapter_image} actual=${actual_adapter_image}"
            exit 1
          fi
          expected_adapter_id="$(docker image inspect "${expected_adapter_image}" --format '{{.Id}}')"
          actual_adapter_id="$(docker inspect fusion-flyai-adapter --format '{{.Image}}')"
          if [ "${actual_adapter_id}" != "${expected_adapter_id}" ]; then
            echo "fusion-flyai-adapter 内容 ID 不匹配: expected=${expected_adapter_id} actual=${actual_adapter_id}"
            exit 1
          fi

      - name: Verify health
        id: verify_health
        run: |
          healthy=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8002/health | grep -q '"status":"healthy"'; then
              healthy=1
              break
            fi
            sleep 2
          done

          if [ "$healthy" != "1" ]; then
            docker logs --tail=120 fusion-api || true
            exit 1
          fi

          adapter_healthy=0
          for attempt in $(seq 1 30); do
            if docker exec fusion-flyai-adapter node -e \
              "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              adapter_healthy=1
              break
            fi
            sleep 2
          done
          if [ "$adapter_healthy" != "1" ]; then
            docker logs --tail=120 fusion-flyai-adapter || true
            exit 1
          fi

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings

          if not settings.ENABLE_FLYAI_TRAVEL_TOOLS:
              raise SystemExit("FlyAI travel tools are disabled")
          if settings.FLYAI_ADAPTER_BASE_URL != "http://flyai-adapter:8080":
              raise SystemExit("FlyAI adapter base URL mismatch")
          if not settings.FLYAI_ADAPTER_TOKEN:
              raise SystemExit("FlyAI adapter token is missing")
          print("FlyAI adapter configuration ok")
          PY

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings

          if "mcp.context7.com" not in settings.RESOLVED_MCP_ALLOWED_HOSTS:
              raise SystemExit("Context7 MCP host policy is missing")
          if "CONTEXT7_API_KEY" not in settings.RESOLVED_MCP_ALLOWED_CREDENTIAL_REFS:
              raise SystemExit("Context7 MCP credential policy is missing")
          print("Context7 MCP policy configuration ok")
          PY

          docker inspect fusion-api --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep -qx '/app/storage/files'
          docker exec -i fusion-api python - <<'PY'
          import asyncio
          import urllib.request

          from app.core.config import settings

          if settings.STORAGE_BACKEND == "local" and settings.FILE_STORAGE_PATH != "/app/storage/files":
              raise SystemExit(f"file storage path mismatch: {settings.FILE_STORAGE_PATH}")
          if settings.STORAGE_BACKEND == "oss":
              missing = [
                  name for name, value in {
                      "OSS_ENDPOINT": settings.OSS_ENDPOINT,
                      "OSS_ACCESS_KEY_ID": settings.OSS_ACCESS_KEY_ID,
                      "OSS_ACCESS_KEY_SECRET": settings.OSS_ACCESS_KEY_SECRET,
                      "OSS_BUCKET": settings.OSS_BUCKET,
                  }.items()
                  if not value
              ]
              if missing:
                  raise SystemExit(f"oss storage config missing: {', '.join(missing)}")
              from app.services.storage.oss_storage import OSSStorageBackend

              storage = OSSStorageBackend(
                  endpoint=settings.OSS_ENDPOINT,
                  access_key_id=settings.OSS_ACCESS_KEY_ID,
                  access_key_secret=settings.OSS_ACCESS_KEY_SECRET,
                  bucket=settings.OSS_BUCKET,
                  use_ssl=settings.OSS_USE_SSL,
              )
              upload = asyncio.run(
                  storage.get_upload_url(
                      "health/cors-preflight.txt",
                      content_type="text/plain",
                      expires=60,
                  )
              )
              origin = settings.FRONTEND_URL.rstrip("/")
              request = urllib.request.Request(
                  upload["url"],
                  method="OPTIONS",
                  headers={
                      "Origin": origin,
                      "Access-Control-Request-Method": "PUT",
                      "Access-Control-Request-Headers": "content-type",
                  },
              )
              with urllib.request.urlopen(request, timeout=10) as response:
                  headers = response.headers
              allow_origin = headers.get("Access-Control-Allow-Origin", "")
              allow_methods = headers.get("Access-Control-Allow-Methods", "")
              allow_headers = headers.get("Access-Control-Allow-Headers", "")
              if allow_origin not in {"*", origin}:
                  raise SystemExit("oss cors origin is not allowed")
              if "PUT" not in allow_methods.upper():
                  raise SystemExit("oss cors PUT method is not allowed")
              if "*" not in allow_headers and "CONTENT-TYPE" not in allow_headers.upper():
                  raise SystemExit("oss cors Content-Type header is not allowed")
          print(f"file storage backend ok: {settings.STORAGE_BACKEND}")
          PY

          docker exec -i fusion-api python - <<'PY'
          from app.core.config import settings
          import urllib.request

          url = settings.RESOLVED_AUTH_SERVICE_JWKS_URL
          with urllib.request.urlopen(url, timeout=5) as response:
              if response.status != 200:
                  raise SystemExit(f"auth JWKS check failed: http={response.status} url={url}")
          print(f"auth JWKS ok: {url}")
          PY

          docker exec -i fusion-api python - <<'PY'
          import asyncio
          import json
          import re
          import urllib.error
          import urllib.request

          from app.core.config import settings

          raw_mode = settings.PROMPTHUB_SYNC_MODE
          mode = getattr(raw_mode, "value", raw_mode).strip().lower()
          if mode == "disabled":
              print("PromptHub bundle smoke skipped: sync mode is disabled")
              raise SystemExit(0)
          if mode not in {"shadow", "apply"}:
              raise SystemExit(f"unsupported PromptHub sync mode: {mode}")

          base_url = settings.PROMPTHUB_BASE_URL.rstrip("/")
          project_slug = settings.PROMPTHUB_PROJECT_SLUG
          api_key = settings.PROMPTHUB_API_KEY
          if not base_url or not project_slug or not api_key:
              raise SystemExit("PromptHub bundle smoke config is incomplete")

          url = f"{base_url}/api/v1/projects/by-slug/{project_slug}/prompts/published"
          request = urllib.request.Request(
              url,
              headers={"Authorization": f"Bearer {api_key}"},
          )
          try:
              with urllib.request.urlopen(
                  request,
                  timeout=settings.PROMPTHUB_REQUEST_TIMEOUT_SECONDS,
              ) as response:
                  status = response.status
                  body = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"PromptHub bundle smoke failed: HTTP {exc.code}") from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"PromptHub bundle smoke failed: {exc.reason}") from None

          if status != 200 or body.get("code") != 0:
              raise SystemExit("PromptHub bundle smoke returned an invalid response")
          data = body.get("data")
          if not isinstance(data, dict):
              raise SystemExit("PromptHub bundle smoke data is missing")
          prompts = data.get("prompts")
          revision = data.get("revision")
          if not isinstance(prompts, list) or len(prompts) != 11:
              count = len(prompts) if isinstance(prompts, list) else "invalid"
              raise SystemExit(f"PromptHub bundle smoke prompt count mismatch: {count}")
          if not isinstance(revision, str) or re.fullmatch(r"[0-9a-f]{64}", revision) is None:
              raise SystemExit("PromptHub bundle smoke revision is invalid")

          from app.db.database import SessionLocal
          from app.db.models import RuntimeConfigEntry
          from app.services.prompthub_sync_service import sync_prompthub_bundle

          sync_result = asyncio.run(sync_prompthub_bundle())
          if sync_result.get("status") != "success" or sync_result.get("revision") != revision:
              raise SystemExit("PromptHub sync did not persist the fetched revision")

          session = SessionLocal()
          try:
              rows = (
                  session.query(RuntimeConfigEntry)
                  .filter(
                      RuntimeConfigEntry.namespace == "prompt_bundle",
                      RuntimeConfigEntry.key == "fusion",
                  )
                  .all()
              )
          finally:
              session.close()
          matching = [row for row in rows if row.version == revision]
          active = [row for row in rows if row.is_active]
          if len(matching) != 1:
              raise SystemExit("PromptHub synced revision is missing or duplicated")
          if mode == "shadow" and matching[0].is_active:
              raise SystemExit("PromptHub shadow revision must remain inactive")
          if mode == "apply" and (not matching[0].is_active or len(active) != 1):
              raise SystemExit("PromptHub apply revision was not atomically activated")
          print(
              "PromptHub bundle smoke passed: "
              f"mode={mode} prompts={len(prompts)} revision={revision[:12]}... persisted=true"
          )
          PY

      - name: Run deployment smoke
        id: deployment_smoke
        run: |
          # scripts/deployment_smoke.py checks /health and /api/models/.
          if ! python3 scripts/deployment_smoke.py --base-url http://127.0.0.1:8002; then
            echo "fusion-api deployment smoke failed"
            docker logs --tail=120 fusion-api || true
            exit 1
          fi

      - name: Roll back failed deployment
        id: rollback_failed_deployment
        if: ${{ failure() && steps.capture_rollback_target.outcome == 'success' && steps.deploy_candidate.outcome != 'skipped' }}
        env:
          ROLLBACK_API_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.api_image_ref }}
          ROLLBACK_API_IMAGE_ID: ${{ steps.capture_rollback_target.outputs.api_image_id }}
          ROLLBACK_ADAPTER_IMAGE_REF: ${{ steps.capture_rollback_target.outputs.adapter_image_ref }}
          ROLLBACK_ADAPTER_IMAGE_ID: ${{ steps.capture_rollback_target.outputs.adapter_image_id }}
          DEPLOY_PROMPTHUB_API_KEY: ${{ secrets.PROMPTHUB_API_KEY }}
          DEPLOY_PROMPTHUB_SYNC_MODE: ${{ vars.PROMPTHUB_SYNC_MODE || 'disabled' }}
          DEPLOY_MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
          DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS: ${{ vars.MCP_ALLOWED_CREDENTIAL_REFS }}
          DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS: ${{ vars.MCP_CONNECT_TIMEOUT_SECONDS }}
          DEPLOY_MCP_CALL_TIMEOUT_SECONDS: ${{ vars.MCP_CALL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS: ${{ vars.MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS: ${{ vars.MCP_ADMIN_OPERATION_TIMEOUT_SECONDS }}
          DEPLOY_MCP_MAX_DISCOVERY_PAGES: ${{ vars.MCP_MAX_DISCOVERY_PAGES }}
          DEPLOY_MCP_MAX_DISCOVERED_TOOLS: ${{ vars.MCP_MAX_DISCOVERED_TOOLS }}
          DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS: ${{ vars.MCP_MAX_TOOL_DESCRIPTION_CHARS }}
          DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES: ${{ vars.MCP_MAX_TOOL_SCHEMA_BYTES }}
          DEPLOY_MCP_MAX_RESPONSE_BYTES: ${{ vars.MCP_MAX_RESPONSE_BYTES }}
          DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN: ${{ vars.MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN }}
          DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD }}
          DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS: ${{ vars.MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS }}
          DEPLOY_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEPLOY_AMAP_MCP_API_KEY: ${{ secrets.AMAP_MCP_API_KEY }}
          DEPLOY_FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
        run: |
          cd ~/project/fusion
          set -o pipefail
          set -a
          source .env
          set +a
          export CONTEXT7_API_KEY=""
          export PROMPTHUB_API_KEY="${DEPLOY_PROMPTHUB_API_KEY:-}"
          export PROMPTHUB_SYNC_MODE="${DEPLOY_PROMPTHUB_SYNC_MODE:-disabled}"
          export MCP_ALLOWED_HOSTS="${DEPLOY_MCP_ALLOWED_HOSTS:-${MCP_ALLOWED_HOSTS:-learn.microsoft.com,dashscope.aliyuncs.com,mcp.amap.com,mcp.context7.com}}"
          export MCP_ALLOWED_CREDENTIAL_REFS="${DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS:-${MCP_ALLOWED_CREDENTIAL_REFS:-DASHSCOPE_API_KEY,AMAP_MCP_API_KEY,CONTEXT7_API_KEY}}"
          export MCP_CONNECT_TIMEOUT_SECONDS="${DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS:-${MCP_CONNECT_TIMEOUT_SECONDS:-5}}"
          export MCP_CALL_TIMEOUT_SECONDS="${DEPLOY_MCP_CALL_TIMEOUT_SECONDS:-${MCP_CALL_TIMEOUT_SECONDS:-15}}"
          export MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS="${DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-${MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-12}}"
          export MCP_ADMIN_OPERATION_TIMEOUT_SECONDS="${DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-${MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-35}}"
          export MCP_MAX_DISCOVERY_PAGES="${DEPLOY_MCP_MAX_DISCOVERY_PAGES:-${MCP_MAX_DISCOVERY_PAGES:-5}}"
          export MCP_MAX_DISCOVERED_TOOLS="${DEPLOY_MCP_MAX_DISCOVERED_TOOLS:-${MCP_MAX_DISCOVERED_TOOLS:-50}}"
          export MCP_MAX_TOOL_DESCRIPTION_CHARS="${DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS:-${MCP_MAX_TOOL_DESCRIPTION_CHARS:-2000}}"
          export MCP_MAX_TOOL_SCHEMA_BYTES="${DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES:-${MCP_MAX_TOOL_SCHEMA_BYTES:-32768}}"
          export MCP_MAX_RESPONSE_BYTES="${DEPLOY_MCP_MAX_RESPONSE_BYTES:-${MCP_MAX_RESPONSE_BYTES:-262144}}"
          export MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN="${DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-${MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-8}}"
          export MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD="${DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-${MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-3}}"
          export MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS="${DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-${MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-30}}"
          export DASHSCOPE_API_KEY="${DEPLOY_DASHSCOPE_API_KEY:-${DASHSCOPE_API_KEY:-}}"
          export AMAP_MCP_API_KEY="${DEPLOY_AMAP_MCP_API_KEY:-${AMAP_MCP_API_KEY:-}}"
          append_csv_value() {
            current="$1"
            required="$2"
            if [ -z "${current}" ]; then
              printf '%s' "${required}"
              return
            fi
            case ",${current}," in
              *",${required},"*) printf '%s' "${current}" ;;
              *) printf '%s,%s' "${current}" "${required}" ;;
            esac
          }
          export MCP_ALLOWED_HOSTS="$(append_csv_value "${MCP_ALLOWED_HOSTS}" "mcp.context7.com")"
          export MCP_ALLOWED_CREDENTIAL_REFS="$(append_csv_value "${MCP_ALLOWED_CREDENTIAL_REFS}" "CONTEXT7_API_KEY")"
          export FLYAI_API_KEY="${DEPLOY_FLYAI_API_KEY:-}"
          if [ -z "${FLYAI_API_KEY}" ]; then
            echo "FlyAI 发布密钥未配置，无法恢复原部署"
            exit 1
          fi
          export FLYAI_ADAPTER_TOKEN="$(python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["FLYAI_API_KEY"].encode(), b"fusion-deploy-flyai-adapter-v1", hashlib.sha256).hexdigest(), end="")')"
          export AUTH_SERVICE_INTERNAL_BASE_URL="http://auth-service:8100"
          export DEPLOY_API_IMAGE="${ROLLBACK_API_IMAGE_REF}"
          export DEPLOY_ADAPTER_IMAGE="${ROLLBACK_ADAPTER_IMAGE_REF}"

          ensure_rollback_image() {
            image_ref="$1"
            expected_id="$2"
            actual_id="$(docker image inspect "${image_ref}" --format '{{.Id}}' 2>/dev/null || true)"
            if [ "${actual_id}" != "${expected_id}" ]; then
              docker pull "${image_ref}"
              actual_id="$(docker image inspect "${image_ref}" --format '{{.Id}}')"
            fi
            if [ -z "${expected_id}" ] || [ "${actual_id}" != "${expected_id}" ]; then
              echo "回滚镜像内容 ID 不匹配: ref=${image_ref} expected=${expected_id} actual=${actual_id:-<empty>}"
              exit 1
            fi
          }

          ensure_rollback_image "${ROLLBACK_API_IMAGE_REF}" "${ROLLBACK_API_IMAGE_ID}"
          ensure_rollback_image "${ROLLBACK_ADAPTER_IMAGE_REF}" "${ROLLBACK_ADAPTER_IMAGE_ID}"

          current_api_ref="$(docker inspect fusion-api --format '{{.Config.Image}}' 2>/dev/null || true)"
          current_api_id="$(docker inspect fusion-api --format '{{.Image}}' 2>/dev/null || true)"
          current_adapter_ref="$(docker inspect fusion-flyai-adapter --format '{{.Config.Image}}' 2>/dev/null || true)"
          current_adapter_id="$(docker inspect fusion-flyai-adapter --format '{{.Image}}' 2>/dev/null || true)"
          if [ "${current_api_ref}" != "${ROLLBACK_API_IMAGE_REF}" ] \
            || [ "${current_api_id}" != "${ROLLBACK_API_IMAGE_ID}" ] \
            || [ "${current_adapter_ref}" != "${ROLLBACK_ADAPTER_IMAGE_REF}" ] \
            || [ "${current_adapter_id}" != "${ROLLBACK_ADAPTER_IMAGE_ID}" ]; then
            if [ ! -f docker-compose.fusion-api-ghcr.yml ]; then
              echo "候选部署未生成 compose 文件且容器身份已变化，无法安全回滚"
              exit 1
            fi
            docker compose -f docker-compose.fusion-api-ghcr.yml up -d
          else
            echo "候选失败发生在容器变更前，原部署无需重建"
          fi

          restored_api_ref="$(docker inspect fusion-api --format '{{.Config.Image}}')"
          restored_api_id="$(docker inspect fusion-api --format '{{.Image}}')"
          restored_adapter_ref="$(docker inspect fusion-flyai-adapter --format '{{.Config.Image}}')"
          restored_adapter_id="$(docker inspect fusion-flyai-adapter --format '{{.Image}}')"
          if [ "${restored_api_ref}" != "${ROLLBACK_API_IMAGE_REF}" ] \
            || [ "${restored_api_id}" != "${ROLLBACK_API_IMAGE_ID}" ]; then
            echo "fusion-api 回滚身份校验失败"
            exit 1
          fi
          if [ "${restored_adapter_ref}" != "${ROLLBACK_ADAPTER_IMAGE_REF}" ] \
            || [ "${restored_adapter_id}" != "${ROLLBACK_ADAPTER_IMAGE_ID}" ]; then
            echo "fusion-flyai-adapter 回滚身份校验失败"
            exit 1
          fi

          api_healthy=0
          for attempt in $(seq 1 30); do
            if docker exec fusion-api python -c \
              "import json,urllib.request; body=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)); raise SystemExit(0 if body.get('status') == 'healthy' else 1)"; then
              api_healthy=1
              break
            fi
            sleep 2
          done
          if [ "${api_healthy}" != "1" ]; then
            docker logs --tail=120 fusion-api || true
            exit 1
          fi

          adapter_healthy=0
          for attempt in $(seq 1 30); do
            if docker exec fusion-flyai-adapter node -e \
              "fetch('http://127.0.0.1:8080/health',{signal:AbortSignal.timeout(2000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              adapter_healthy=1
              break
            fi
            sleep 2
          done
          if [ "${adapter_healthy}" != "1" ]; then
            docker logs --tail=120 fusion-flyai-adapter || true
            exit 1
          fi

          if ! python3 scripts/deployment_smoke.py --base-url http://127.0.0.1:8002; then
            echo "fusion-api rollback deployment smoke failed"
            docker logs --tail=120 fusion-api || true
            exit 1
          fi
          echo "旧镜像已恢复且回滚后验收通过；原始发布失败状态保持不变"

      - name: Cleanup old images
        id: cleanup_old_images
        if: success()
        run: |
          current="${IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          adapter_current="${FLYAI_ADAPTER_IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' ${{ env.IMAGE_NAME }} \
            | awk -v current="$current" '$1 != current {print $2}' \
            | sort -u \
            | xargs -r docker rmi || true
          docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' ${{ env.FLYAI_ADAPTER_IMAGE_NAME }} \
            | awk -v current="$adapter_current" '$1 != current {print $2}' \
            | sort -u \
            | xargs -r docker rmi || true

      - name: Push CI/CD metrics
        if: always()
        run: |
          if ! timeout 15s bash ~/scripts/push-cicd-metrics.sh \
            fusion-api \
            "${{ github.ref_name }}" \
            dev \
            "${{ job.status }}" \
            "${{ needs.publish.outputs.started_at || needs.prepare.outputs.started_at }}" \
            "${IMAGE_NAME}:${DEPLOY_TARGET_SHA}" \
            "${DEPLOY_TARGET_SHA}" \
            "${{ needs.publish.outputs.runner_name || runner.name }}" \
            fusion-api \
            "${{ env.DEPLOY_START }}"; then
            echo "CI/CD metrics push failed, ignored"
          fi

      - name: 通知飞书(部署结果)
        if: always()
        continue-on-error: true
        env:
          FEISHU_INFRA_WEBHOOK: ${{ secrets.FEISHU_INFRA_WEBHOOK }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          ROLLBACK_REASON: ${{ github.event.inputs.rollback_reason }}
          # 提交信息可含任意字符,只经 env 传入 python(os.environ→json),绝不进 shell,杜绝注入。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$FEISHU_INFRA_WEBHOOK" ]; then
            echo "FEISHU_INFRA_WEBHOOK 未配置,跳过飞书通知"
            exit 0
          fi
          export DEPLOY_TS="$(date -u '+%Y-%m-%d %H:%M UTC')"
          python3 - <<'PY'
          import json, os, urllib.request
          ok = os.environ.get("JOB_STATUS") == "success"
          repo = os.environ.get("REPO", "")
          ref = os.environ.get("REF_NAME", "")
          sha = os.environ.get("TARGET_SHA", "")[:7]
          status = os.environ.get("JOB_STATUS", "")
          ts = os.environ.get("DEPLOY_TS", "")
          run_url = os.environ.get("RUN_URL", "")
          rollback_reason = os.environ.get("ROLLBACK_REASON", "").strip()
          raw = (
              f"手动回滚：{rollback_reason}"
              if rollback_reason
              else os.environ.get("COMMIT_MSG", "") or ""
          )
          lines = [ln for ln in raw.splitlines() if ln.strip()]
          msg = "\n".join(lines[:3]) if lines else "(无提交信息)"
          if len(msg) > 240:
              msg = msg[:240] + "…"
          card = {
              "msg_type": "interactive",
              "card": {
                  "config": {"wide_screen_mode": True},
                  "header": {
                      "template": "green" if ok else "red",
                      "title": {"tag": "plain_text",
                                "content": ("✅ 部署成功 · " if ok else "❌ 部署失败 · ") + repo},
                  },
                  "elements": [
                      {"tag": "div", "text": {"tag": "lark_md", "content": f"**提交信息**\n{msg}"}},
                      {"tag": "hr"},
                      {"tag": "div", "fields": [
                          {"is_short": True, "text": {"tag": "lark_md", "content": f"**分支**\n{ref}"}},
                          {"is_short": True, "text": {"tag": "lark_md", "content": f"**提交**\n`{sha}`"}},
                          {"is_short": True, "text": {"tag": "lark_md", "content": f"**结果**\n{status}"}},
                          {"is_short": True, "text": {"tag": "lark_md", "content": f"**时间**\n{ts}"}},
                      ]},
                      {"tag": "action", "actions": [
                          {"tag": "button", "type": "primary",
                           "text": {"tag": "plain_text", "content": "查看运行日志"},
                           "url": run_url}]},
                      {"tag": "note", "elements": [
                          {"tag": "plain_text", "content": "🤖 UptimeKuma · CI/CD 部署告警"}]},
                  ],
              },
          }
          data = json.dumps(card).encode()
          req = urllib.request.Request(
              os.environ["FEISHU_INFRA_WEBHOOK"], data=data,
              headers={"Content-Type": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  print(f"飞书响应 http={r.status} body={r.read().decode()}")
          except Exception as e:
              print(f"飞书通知失败(忽略): {e!r}")
          PY

      - name: Cleanup Docker credential directory
        if: always()
        run: |
          expected="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          if [ -z "${DOCKER_CONFIG:-}" ] || [ "${DOCKER_CONFIG}" != "${expected}" ]; then
            echo "DOCKER_CONFIG 与当前 job 的隔离目录不一致，拒绝删除: ${DOCKER_CONFIG:-<empty>}"
            exit 1
          fi
          case "${DOCKER_CONFIG}" in
            "${RUNNER_TEMP}"/.docker-*) ;;
            *) echo "DOCKER_CONFIG 未落在 RUNNER_TEMP 的 .docker-* 路径中，拒绝删除"; exit 1 ;;
          esac
          rm -rf -- "${DOCKER_CONFIG}"

  finalize:
    name: Finalize release result
    if: ${{ always() && github.ref == 'refs/heads/master' }}
    needs: [prepare, publish, deploy-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Finalize release result
        id: finalize_release_result
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          DEPLOY_RESULT: ${{ needs.deploy-dev.result }}
          ROLLBACK_REQUESTED: ${{ needs.prepare.outputs.rollback_requested }}
        run: |
          if [ "${PREPARE_RESULT}" != "success" ]; then
            echo "部署请求校验失败或未执行: ${PREPARE_RESULT}"
            exit 1
          fi

          if [ "${ROLLBACK_REQUESTED}" = "true" ]; then
            if [ "${PUBLISH_RESULT}" = "skipped" ] && [ "${DEPLOY_RESULT}" = "success" ]; then
              echo "手动回滚成功，Windows publish 按设计跳过"
              exit 0
            fi
            echo "手动回滚失败: publish=${PUBLISH_RESULT} deploy=${DEPLOY_RESULT}"
            exit 1
          fi

          if [ "${PUBLISH_RESULT}" = "success" ] && [ "${DEPLOY_RESULT}" = "success" ]; then
            echo "正常发布成功"
            exit 0
          fi
          echo "正常发布失败: publish=${PUBLISH_RESULT} deploy=${DEPLOY_RESULT}"
          exit 1
