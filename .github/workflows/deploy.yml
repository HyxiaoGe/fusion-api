name: Fusion API Windows CI

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 要恢复的已发布镜像 SHA（40 位小写 Git SHA；留空表示正常发布）
        required: false
        type: string
      rollback_reason:
        description: 手动回滚原因（填写 rollback_sha 时必填）
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: fusion-api-windows-ci-${{ github.ref }}
  # 发布可能正在执行 Alembic 或容器重启，后续 push 只能排队，不能中途取消。
  cancel-in-progress: false

# 镜像源:阿里云 ACR 个人版(深圳,境内端点);改仓名只动 IMAGE_NAME 一行
env:
  REGISTRY: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/fusion-api
  FLYAI_ADAPTER_IMAGE_NAME: crpi-77w10wlykpqilmmb.cn-shenzhen.personal.cr.aliyuncs.com/seanfield/fusion-flyai-adapter

jobs:
  prepare:
    name: Validate deployment request
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.deployment_request.outputs.started_at }}
      target_sha: ${{ steps.deployment_request.outputs.target_sha }}
      rollback_requested: ${{ steps.deployment_request.outputs.rollback_requested }}

    steps:
      - name: Validate deployment request
        id: deployment_request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
          REQUESTED_ROLLBACK_REASON: ${{ github.event.inputs.rollback_reason }}
        run: |
          rollback_sha="${REQUESTED_ROLLBACK_SHA:-}"
          rollback_reason="${REQUESTED_ROLLBACK_REASON:-}"
          target_sha="${GITHUB_SHA}"
          rollback_requested="false"

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if [ -n "${rollback_sha}" ]; then
              if [[ ! "${rollback_sha}" =~ ^[0-9a-f]{40}$ ]]; then
                echo "rollback_sha 必须是 40 位小写 Git SHA"
                exit 1
              fi
              if [[ ! "${rollback_reason}" =~ [^[:space:]] ]]; then
                echo "填写 rollback_sha 时 rollback_reason 必填"
                exit 1
              fi
              target_sha="${rollback_sha}"
              rollback_requested="true"
            elif [[ "${rollback_reason}" =~ [^[:space:]] ]]; then
              echo "rollback_reason 不能在 rollback_sha 为空时单独填写"
              exit 1
            fi
          elif [ -n "${rollback_sha}" ] || [[ "${rollback_reason}" =~ [^[:space:]] ]]; then
            echo "push 事件不得携带手动回滚参数"
            exit 1
          fi

          {
            printf '%s\n' "started_at=$(date +%s)"
            printf '%s\n' "target_sha=${target_sha}"
            printf '%s\n' "rollback_requested=${rollback_requested}"
          } >> "${GITHUB_OUTPUT}"

  publish:
    name: Publish master images on Windows runner
    if: github.ref == 'refs/heads/master' && needs.prepare.outputs.rollback_requested != 'true'
    needs: prepare
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    environment:
      name: dev
      deployment: false
    outputs:
      started_at: ${{ steps.pipeline_start.outputs.started_at }}
      runner_name: ${{ steps.pipeline_start.outputs.runner_name }}
    defaults:
      run:
        shell: cmd

    steps:
      - name: Record pipeline start
        id: pipeline_start
        run: |
          for /f %%i in ('powershell -NoProfile -ExecutionPolicy Bypass -Command "[DateTimeOffset]::UtcNow.ToUnixTimeSeconds()"') do echo started_at=%%i>>%GITHUB_OUTPUT%
          echo runner_name=${{ runner.name }}>>%GITHUB_OUTPUT%

      - name: Configure Docker credential directory
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $dockerConfig = Join-Path $env:RUNNER_TEMP ".docker-$env:GITHUB_RUN_ID-$env:GITHUB_JOB"
          New-Item -ItemType Directory -Force -Path $dockerConfig | Out-Null
          "DOCKER_CONFIG=$dockerConfig" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Push CI/CD active metric
        if: github.ref == 'refs/heads/master'
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          PUSHGW_AUTH: ${{ secrets.PUSHGW_BASIC_AUTH }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $now = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          $metrics = @"
          # HELP cicd_pipeline_active Whether a CI/CD pipeline is currently active (1=true, 0=false).
          # TYPE cicd_pipeline_active gauge
          cicd_pipeline_active{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} 1
          # HELP cicd_pipeline_active_timestamp_seconds Timestamp of the latest CI/CD active-state update.
          # TYPE cicd_pipeline_active_timestamp_seconds gauge
          cicd_pipeline_active_timestamp_seconds{project="fusion-api",branch="$env:GITHUB_REF_NAME",environment="dev",runner="${{ runner.name }}"} $now
          "@
          $body = (($metrics -replace "`r`n", "`n").Trim() + "`n")
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($body)
          try {
            # pushgateway 本体只绑 loopback,经 nginx 9094 鉴权反代推送(凭证在仓库 Secret PUSHGW_BASIC_AUTH)
            Invoke-WebRequest -UseBasicParsing -Method Post -Uri "http://192.168.1.11:9094/metrics/job/cicd_active/project_key/fusion-api/branch_key/master/environment_key/dev" -ContentType "text/plain; version=0.0.4" -Headers @{ Authorization = "Basic $env:PUSHGW_AUTH" } -Body $bytes -TimeoutSec 5 | Out-Null
            Write-Host "CI/CD active metric pushed"
          } catch {
            Write-Host "CI/CD active metric push failed, ignored: $($_.Exception.Message)"
          }

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify Docker access
        run: |
          docker version
          docker ps

      - name: Test and build Docker image
        timeout-minutes: 15
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & ".github/scripts/windows-build-and-test.ps1" `
            -ImageName "${env:IMAGE_NAME}" `
            -AdapterImageName "${env:FLYAI_ADAPTER_IMAGE_NAME}" `
            -ImageTag "${env:GITHUB_SHA}"

      - name: Login to ACR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
          # 凭据目录由 always cleanup 统一删除，避免 post-action 在目录删除后重新创建。
          logout: false

      - name: Push Docker image
        run: |
          docker push "%IMAGE_NAME%:%GITHUB_SHA%"
          docker push "%FLYAI_ADAPTER_IMAGE_NAME%:%GITHUB_SHA%"

      - name: Cleanup local Docker artifacts
        if: always()
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          & ".github/scripts/windows-cleanup.ps1" `
            -ImageName "${env:IMAGE_NAME}" `
            -AdapterImageName "${env:FLYAI_ADAPTER_IMAGE_NAME}" `
            -ImageTag "${env:GITHUB_SHA}"

  deploy-dev:
    name: Deploy master on dev server
    if: >-
      ${{ always() && github.ref == 'refs/heads/master' &&
      needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.rollback_requested == 'true' && needs.publish.result == 'skipped') ||
      (needs.prepare.outputs.rollback_requested != 'true' && needs.publish.result == 'success')) }}
    needs: [prepare, publish]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: dev
    env:
      DEPLOY_TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}

    steps:
      - name: Record deploy start time
        run: echo "DEPLOY_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Checkout smoke scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Configure Docker credential directory
        run: |
          docker_config="${RUNNER_TEMP}/.docker-${GITHUB_RUN_ID}-${GITHUB_JOB}"
          case "${docker_config}" in
            "${RUNNER_TEMP}"/.docker-*) ;;
            *) echo "Docker 凭据目录未落在 RUNNER_TEMP 的隔离路径中"; exit 1 ;;
          esac
          mkdir -p -- "${docker_config}"
          printf '%s\n' "DOCKER_CONFIG=${docker_config}" >> "${GITHUB_ENV}"

      - name: Capture current deployment for rollback
        id: capture_rollback_target
        run: |
          set -o pipefail
          if [[ ! "${DEPLOY_TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "部署目标不是 40 位小写 Git SHA，拒绝变更部署"
            exit 1
          fi
          if ! docker container inspect fusion-api >/dev/null 2>&1; then
            echo "fusion-api 不存在，拒绝在缺少回滚目标时变更部署"
            exit 1
          fi
          if ! docker container inspect fusion-flyai-adapter >/dev/null 2>&1; then
            echo "fusion-flyai-adapter 不存在，拒绝在缺少回滚目标时变更部署"
            exit 1
          fi

          api_image_ref="$(docker inspect fusion-api --format '{{.Config.Image}}')"
          api_image_id="$(docker inspect fusion-api --format '{{.Image}}')"
          adapter_image_ref="$(docker inspect fusion-flyai-adapter --format '{{.Config.Image}}')"
          adapter_image_id="$(docker inspect fusion-flyai-adapter --format '{{.Image}}')"
          api_image_prefix="${IMAGE_NAME}:"
          case "${api_image_ref}" in
            "${api_image_prefix}"*) api_sha="${api_image_ref#"${api_image_prefix}"}" ;;
            *) echo "fusion-api 镜像仓库不受当前 workflow 管理: ${api_image_ref}"; exit 1 ;;
          esac
          if [[ ! "${api_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "fusion-api 镜像标签不是 40 位小写 Git SHA: ${api_image_ref}"
            exit 1
          fi
          expected_adapter_ref="${FLYAI_ADAPTER_IMAGE_NAME}:${api_sha}"
          if [ "${adapter_image_ref}" != "${expected_adapter_ref}" ]; then
            echo "fusion-flyai-adapter 与 fusion-api 未运行同一 SHA: expected=${expected_adapter_ref} actual=${adapter_image_ref}"
            exit 1
          fi
          if [[ ! "${api_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "fusion-api 内容 ID 格式无效: ${api_image_id}"
            exit 1
          fi
          if [[ ! "${adapter_image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "fusion-flyai-adapter 内容 ID 格式无效: ${adapter_image_id}"
            exit 1
          fi

          {
            printf '%s\n' "api_image_ref=${api_image_ref}"
            printf '%s\n' "api_image_id=${api_image_id}"
            printf '%s\n' "adapter_image_ref=${adapter_image_ref}"
            printf '%s\n' "adapter_image_id=${adapter_image_id}"
          } >> "${GITHUB_OUTPUT}"

      - name: Login to ACR
        run: |
          # 登录失败时重试退避（境内 ACR 通常稳定，保留重试作防御）
          n=0
          until printf '%s' "${ACR_PASSWORD}" | docker login "${REGISTRY}" -u "${ACR_USERNAME}" --password-stdin; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker login 重试 $n 次仍失败"; exit 1; fi
            echo "docker login 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}

      - name: Apply alembic migrations
        id: apply_migrations
        if: needs.prepare.outputs.rollback_requested != 'true'
        run: |
          cd ~/project/fusion
          set -a
          source .env
          set +a
          n=0
          until docker pull "${IMAGE_NAME}:${DEPLOY_TARGET_SHA}"; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker pull 重试 $n 次仍失败"; exit 1; fi
            echo "docker pull 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          docker run --rm \
            --network postgres_default \
            -e DATABASE_URL="${DATABASE_URL}" \
            "${IMAGE_NAME}:${DEPLOY_TARGET_SHA}" \
            alembic upgrade head

      - name: Pull and restart fusion-api
        id: deploy_candidate
        env:
          DEPLOY_PROMPTHUB_API_KEY: ${{ secrets.PROMPTHUB_API_KEY }}
          DEPLOY_PROMPTHUB_SYNC_MODE: ${{ vars.PROMPTHUB_SYNC_MODE || 'disabled' }}
          DEPLOY_MCP_ALLOWED_HOSTS: ${{ vars.MCP_ALLOWED_HOSTS }}
          DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS: ${{ vars.MCP_ALLOWED_CREDENTIAL_REFS }}
          DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS: ${{ vars.MCP_CONNECT_TIMEOUT_SECONDS }}
          DEPLOY_MCP_CALL_TIMEOUT_SECONDS: ${{ vars.MCP_CALL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS: ${{ vars.MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS }}
          DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS: ${{ vars.MCP_ADMIN_OPERATION_TIMEOUT_SECONDS }}
          DEPLOY_MCP_MAX_DISCOVERY_PAGES: ${{ vars.MCP_MAX_DISCOVERY_PAGES }}
          DEPLOY_MCP_MAX_DISCOVERED_TOOLS: ${{ vars.MCP_MAX_DISCOVERED_TOOLS }}
          DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS: ${{ vars.MCP_MAX_TOOL_DESCRIPTION_CHARS }}
          DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES: ${{ vars.MCP_MAX_TOOL_SCHEMA_BYTES }}
          DEPLOY_MCP_MAX_RESPONSE_BYTES: ${{ vars.MCP_MAX_RESPONSE_BYTES }}
          DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN: ${{ vars.MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN }}
          DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD: ${{ vars.MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD }}
          DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS: ${{ vars.MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS }}
          DEPLOY_DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
          DEPLOY_AMAP_MCP_API_KEY: ${{ secrets.AMAP_MCP_API_KEY }}
          DEPLOY_FLYAI_API_KEY: ${{ secrets.FLYAI_API_KEY }}
        run: |
          cd ~/project/fusion
          set -o pipefail
          set -a
          source .env
          set +a
          export CONTEXT7_API_KEY=""
          export PROMPTHUB_API_KEY="${DEPLOY_PROMPTHUB_API_KEY:-}"
          export PROMPTHUB_SYNC_MODE="${DEPLOY_PROMPTHUB_SYNC_MODE:-disabled}"
          export MCP_ALLOWED_HOSTS="${DEPLOY_MCP_ALLOWED_HOSTS:-${MCP_ALLOWED_HOSTS:-learn.microsoft.com,dashscope.aliyuncs.com,mcp.amap.com,mcp.context7.com}}"
          export MCP_ALLOWED_CREDENTIAL_REFS="${DEPLOY_MCP_ALLOWED_CREDENTIAL_REFS:-${MCP_ALLOWED_CREDENTIAL_REFS:-DASHSCOPE_API_KEY,AMAP_MCP_API_KEY,CONTEXT7_API_KEY}}"
          export MCP_CONNECT_TIMEOUT_SECONDS="${DEPLOY_MCP_CONNECT_TIMEOUT_SECONDS:-${MCP_CONNECT_TIMEOUT_SECONDS:-5}}"
          export MCP_CALL_TIMEOUT_SECONDS="${DEPLOY_MCP_CALL_TIMEOUT_SECONDS:-${MCP_CALL_TIMEOUT_SECONDS:-15}}"
          export MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS="${DEPLOY_MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-${MCP_IDEMPOTENT_TOTAL_TIMEOUT_SECONDS:-12}}"
          export MCP_ADMIN_OPERATION_TIMEOUT_SECONDS="${DEPLOY_MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-${MCP_ADMIN_OPERATION_TIMEOUT_SECONDS:-35}}"
          export MCP_MAX_DISCOVERY_PAGES="${DEPLOY_MCP_MAX_DISCOVERY_PAGES:-${MCP_MAX_DISCOVERY_PAGES:-5}}"
          export MCP_MAX_DISCOVERED_TOOLS="${DEPLOY_MCP_MAX_DISCOVERED_TOOLS:-${MCP_MAX_DISCOVERED_TOOLS:-50}}"
          export MCP_MAX_TOOL_DESCRIPTION_CHARS="${DEPLOY_MCP_MAX_TOOL_DESCRIPTION_CHARS:-${MCP_MAX_TOOL_DESCRIPTION_CHARS:-2000}}"
          export MCP_MAX_TOOL_SCHEMA_BYTES="${DEPLOY_MCP_MAX_TOOL_SCHEMA_BYTES:-${MCP_MAX_TOOL_SCHEMA_BYTES:-32768}}"
          export MCP_MAX_RESPONSE_BYTES="${DEPLOY_MCP_MAX_RESPONSE_BYTES:-${MCP_MAX_RESPONSE_BYTES:-262144}}"
          export MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN="${DEPLOY_MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-${MCP_MAX_TOOL_CALLS_PER_SERVER_PER_RUN:-8}}"
          export MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD="${DEPLOY_MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-${MCP_SERVER_CIRCUIT_FAILURE_THRESHOLD:-3}}"
          export MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS="${DEPLOY_MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-${MCP_SERVER_CIRCUIT_COOLDOWN_SECONDS:-30}}"
          export DASHSCOPE_API_KEY="${DEPLOY_DASHSCOPE_API_KEY:-${DASHSCOPE_API_KEY:-}}"
          export AMAP_MCP_API_KEY="${DEPLOY_AMAP_MCP_API_KEY:-${AMAP_MCP_API_KEY:-}}"
          append_csv_value() {
            current="$1"
            required="$2"
            if [ -z "${current}" ]; then
              printf '%s' "${required}"
              return
            fi
            case ",${current}," in
              *",${required},"*) printf '%s' "${current}" ;;
              *) printf '%s,%s' "${current}" "${required}" ;;
            esac
          }
          export MCP_ALLOWED_HOSTS="$(append_csv_value "${MCP_ALLOWED_HOSTS}" "mcp.context7.com")"
          export MCP_ALLOWED_CREDENTIAL_REFS="$(append_csv_value "${MCP_ALLOWED_CREDENTIAL_REFS}" "CONTEXT7_API_KEY")"
          export FLYAI_API_KEY="${DEPLOY_FLYAI_API_KEY:-}"
          if [ -z "${FLYAI_API_KEY}" ]; then
            echo "FlyAI 发布密钥未配置，拒绝以静默禁用方式部署"
            exit 1
          fi
          export FLYAI_ADAPTER_TOKEN="$(python3 -c 'import hashlib,hmac,os; print(hmac.new(os.environ["FLYAI_API_KEY"].encode(), b"fusion-deploy-flyai-adapter-v1", hashlib.sha256).hexdigest(), end="")')"
          export DEPLOY_API_IMAGE="${IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          export DEPLOY_ADAPTER_IMAGE="${FLYAI_ADAPTER_IMAGE_NAME}:${DEPLOY_TARGET_SHA}"
          n=0
          until docker pull "${DEPLOY_API_IMAGE}"; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "docker pull 重试 $n 次仍失败"; exit 1; fi
            echo "docker pull 失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          n=0
          until docker pull "${DEPLOY_ADAPTER_IMAGE}"; do
            n=$((n+1))
            if [ $n -ge 6 ]; then echo "FlyAI adapter 镜像拉取重试 $n 次仍失败"; exit 1; fi
            echo "FlyAI adapter 镜像拉取失败（网络抖动），第 $n 次，10s 后重试..."
            sleep 10
          done
          # dev 中 auth-service 只在 Docker 网络内暴露，未发布宿主机 8100。
          # 显式覆盖旧 .env 里的宿主机地址，避免 fusion-api JWKS/userinfo 校验连到不可达地址。
          export AUTH_SERVICE_INTERNAL_BASE_URL="http://auth-service:8100"
          mkdir -p ./fusion-api/storage/files
          if docker container inspect fusion-api >/dev/null 2>&1; then
            if docker inspect fusion-api --format '{{range .Mounts}}{{println .Destination}}{{end}}' | grep -qx '/app/storage/files'; then
              echo "file storage already mounted; skip container file migration"
            elif docker exec fusion-api sh -lc 'test -d /app/storage/files'; then
              docker exec fusion-api sh -lc 'tar -C /app/storage/files -cf - .' | tar -C ./fusion-api/storage/files -xf -
            fi
          fi
          cat > docker-compose.fusion-api-ghcr.yml <<'EOF'
          services:
            flyai-adapter:
              image: ${DEPLOY_ADAPTER_IMAGE}
              container_name: fusion-flyai-adapter
              restart: always
              read_only: true
              tmpfs:
                - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
              cap_drop:
                - ALL
              security_opt:
                - no-new-privileges:true
              pids_limit: 64
              mem_limit: 256m
              cpus: 0.5
              environment:
                - FLYAI_API_KEY=${FLYAI_API_KEY}
                - FLYAI_ADAPTER_TOKEN=${FLYAI_ADAPTER_TOKEN}
                - PORT=8080
              networks:
                - fusion-flyai

            fusion-api:
              image: ${DEPLOY_API_IMAGE}
              container_name: fusion-api
              command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
              restart: always
              ports:
                - "8002:8000"
              volumes:
                - ./fusion-api/logs:/app/logs
                - ./fusion-api/storage/files:/app/storage/files
              environment:
                - DATABASE_URL=${DATABASE_URL}
                - SERVER_HOST=${SERVER_HOST}
                - FRONTEND_URL=${FRONTEND_URL}
                - CORS_ORIGINS=${CORS_ORIGINS}
                - STORAGE_BACKEND=${STORAGE_BACKEND:-local}
                - FILE_STORAGE_PATH=/app/storage/files
                - FILE_UPLOAD_TIMEOUT_SECONDS=${FILE_UPLOAD_TIMEOUT_SECONDS:-60}
                - DIRECT_UPLOAD_STALE_SECONDS=${DIRECT_UPLOAD_STALE_SECONDS:-1800}
                - MINIO_ENDPOINT=${MINIO_ENDPOINT:-}
                - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
                - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
                - MINIO_BUCKET=${MINIO_BUCKET:-fusion-files}
                - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
                - MINIO_PRESIGN_EXPIRES=${MINIO_PRESIGN_EXPIRES:-3600}
                - OSS_ENDPOINT=${OSS_ENDPOINT:-}
                - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID:-}
                - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET:-}
                - OSS_BUCKET=${OSS_BUCKET:-}
                - OSS_USE_SSL=${OSS_USE_SSL:-true}
                - AUTH_SERVICE_BASE_URL=${AUTH_SERVICE_BASE_URL}
                - AUTH_SERVICE_JWKS_URL=${AUTH_SERVICE_JWKS_URL}
                - AUTH_SERVICE_CLIENT_ID=${AUTH_SERVICE_CLIENT_ID}
                - AUTH_SERVICE_JWT_LEEWAY_SECONDS=${AUTH_SERVICE_JWT_LEEWAY_SECONDS:-5}
                - AUTH_SERVICE_INTERNAL_BASE_URL=${AUTH_SERVICE_INTERNAL_BASE_URL:-http://auth-service:8100}
                - CREDENTIAL_ENCRYPTION_KEY=${CREDENTIAL_ENCRYPTION_KEY}
                - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
                - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
                - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                - REDIS_URL=${REDIS_URL:-redis://middleware-redis:6379/0}
                - MOONSHOT_API_KEY=${MOONSHOT_API_KEY:-}
                - LITELLM_PROXY_URL=${LITELLM_PROXY_URL:-http://litellm-proxy:4000}
                - LITELLM_API_KEY=${LITELLM_API_KEY:-}
