name: Engineering baseline drift audit

on:
  schedule:
    # 每周一（Asia/Shanghai）执行。
    - cron: "23 18 * * 0"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: fusion-api-engineering-baseline-drift-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Engineering baseline drift audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Audit repository
        uses: HyxiaoGe/engineering-baseline/.github/actions/audit@a87c78c4ff6594b4351678bea354ff1f171645e9 # v1.1.0
        with:
          repository: ${{ github.repository }}
